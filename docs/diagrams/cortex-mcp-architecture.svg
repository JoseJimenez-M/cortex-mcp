      <text x="800" y="668" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/data/vault</text>
      <text x="800" y="680" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Markdown, mounted from host</text>

