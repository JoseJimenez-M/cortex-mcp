      <rect x="976" y="760" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="976" y="760" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
