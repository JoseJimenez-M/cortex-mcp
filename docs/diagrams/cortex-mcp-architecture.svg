      <text x="656" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Core library</text>
      <text x="656" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">knows nothing about MCP or HTTP</text>
      <text x="656" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">read · search · write · sections</text>
      <text x="656" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">frontmatter · links · trash</text>

