<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">How cortex-mcp fits together</title>
  <desc id="overview-desc">Assistant apps and scripts reach cortex-mcp over HTTPS through a TLS reverse proxy, authenticating with OAuth 2.1 or a Bearer token. cortex-mcp keeps its auth database and write log in state_dir and reads and writes a folder of Markdown files, which the owner can open in Obsidian, sync, version with git, or back up with tools outside cortex-mcp.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============ ZONES ============ -->
  <rect x="24" y="28" width="1152" height="118" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="36" y="32" width="196" height="12" rx="2" fill="#f5f5f5"/>
  <text x="40" y="41" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ASSISTANTS · ANY MCP CLIENT</text>

  <rect x="400" y="204" width="720" height="356" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="412" y="208" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="416" y="217" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">YOUR SERVER</text>

  <!-- ============ ARROWS (drawn before nodes) ============ -->
  <!-- Clients to the bus -->
  <line x1="140" y1="124" x2="140" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="370" y1="124" x2="370" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="600" y1="124" x2="600" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="830" y1="124" x2="830" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="1060" y1="124" x2="1060" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="140" y1="172" x2="1060" y2="172" stroke="#2e5aa8" stroke-width="1.2"/>
  <line x1="600" y1="172" x2="600" y2="236" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="612" y="182" width="196" height="12" rx="2" fill="#f5f5f5"/>
  <text x="710" y="191" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS · OAUTH 2.1 OR BEARER</text>

  <!-- Proxy to cortex-mcp -->
  <line x1="600" y1="300" x2="600" y2="340" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="612" y="314" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="642" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text>

  <!-- cortex-mcp to state_dir -->
  <line x1="760" y1="382" x2="836" y2="382" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="772" y="362" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="798" y="371" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE</text>

  <!-- cortex-mcp to vault (focal) -->
  <line x1="600" y1="424" x2="600" y2="468" stroke="#eb6c36" stroke-width="1.2" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
  <rect x="612" y="440" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="650" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ / WRITE</text>

  <!-- Vault to the owner's own tools -->
  <line x1="600" y1="540" x2="600" y2="592" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="255" y1="592" x2="945" y2="592" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="255" y1="592" x2="255" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="485" y1="592" x2="485" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="715" y1="592" x2="715" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="945" y1="592" x2="945" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="612" y="566" width="212" height="12" rx="2" fill="#f5f5f5"/>
  <text x="718" y="575" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YOUR CHOICE · OUTSIDE CORTEX-MCP</text>

  <!-- ============ NODES ============ -->
  <!-- Assistants -->
  <g font-family="'Geist', sans-serif" text-anchor="middle">
    <rect x="40" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="140" y="88" fill="#2d3142" font-size="12" font-weight="600">claude.ai</text>
    <text x="140" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">web · desktop · phone · OAuth</text>

    <rect x="270" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="370" y="88" fill="#2d3142" font-size="12" font-weight="600">ChatGPT</text>
    <text x="370" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">connector · OAuth</text>

    <rect x="500" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="600" y="88" fill="#2d3142" font-size="12" font-weight="600">Meta Muse</text>
    <text x="600" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">custom connector · OAuth</text>

    <rect x="730" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="830" y="88" fill="#2d3142" font-size="12" font-weight="600">Claude Code</text>
    <text x="830" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">OAuth or Bearer token</text>

    <rect x="960" y="60" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="1060" y="88" fill="#2d3142" font-size="12" font-weight="600">Scripts and agents</text>
    <text x="1060" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">any MCP client · Bearer</text>

    <!-- Proxy -->
    <rect x="480" y="236" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="600" y="264" fill="#2d3142" font-size="12" font-weight="600">TLS reverse proxy</text>
    <text x="600" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Caddy, nginx · :443</text>

    <!-- cortex-mcp (focal) -->
    <rect x="440" y="340" width="320" height="84" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
    <text x="600" y="368" fill="#2d3142" font-size="15" font-weight="600">cortex-mcp</text>
    <text x="600" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">single Go binary · /mcp · 12 tools</text>
    <text x="600" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">owner login: passkey · TOTP · recovery code</text>

    <!-- state_dir -->
    <rect x="836" y="350" width="260" height="64" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.60)" stroke-width="1"/>
    <text x="966" y="378" fill="#2d3142" font-size="12" font-weight="600">state_dir</text>
    <text x="966" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">auth.db (SQLite) · writes.log</text>

    <!-- Vault -->
    <rect x="460" y="468" width="280" height="72" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.60)" stroke-width="1"/>
    <text x="600" y="496" fill="#2d3142" font-size="12" font-weight="600">Your vault</text>
    <text x="600" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a folder of .md files</text>
    <text x="600" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">.trash/ instead of deletes</text>

    <!-- The owner's own tools (external, optional) -->
    <rect x="170" y="612" width="170" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="255" y="636" fill="#2d3142" font-size="12" font-weight="600">Obsidian</text>
    <text x="255" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">or any editor</text>

    <rect x="400" y="612" width="170" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="485" y="636" fill="#2d3142" font-size="12" font-weight="600">Syncthing</text>
    <text x="485" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">laptop · phone · PC</text>

    <rect x="630" y="612" width="170" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="715" y="636" fill="#2d3142" font-size="12" font-weight="600">git</text>
    <text x="715" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">history</text>

    <rect x="860" y="612" width="170" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="945" y="636" fill="#2d3142" font-size="12" font-weight="600">Backups</text>
    <text x="945" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">your usual tool</text>
  </g>
</svg>
