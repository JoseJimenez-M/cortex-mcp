# cortex-mcp configuration. Unknown keys are rejected at startup.
# Required: vault, state_dir, public_url. Everything else has the default shown.

# The Markdown folder to serve. Absolute path.
vault: /data/vault

# Where auth.db (owner credentials, OAuth state, hashed Bearer tokens) and
# writes.log live. Absolute path.
# Must NOT be the vault or inside it, so secrets never sync with the notes.
# On Linux and macOS it must also not be a shared directory (sticky or
# world-writable, like /tmp): use a dedicated one.
state_dir: /data/state

# The URL clients use to reach the server. https, host (and optional port)
# only: no path, query, fragment, or credentials. http is accepted only for
# loopback hosts: localhost (any case) and loopback IPs (127.0.0.0/8, ::1).
public_url: https://mcp.example.com

# Address to bind, host:port. Default "127.0.0.1:8080": loopback only, for a
# reverse proxy on the same host that terminates TLS. In a container use
# ":8080" so the runtime's port mapping can reach it. serve logs a warning
# when public_url is https and this is not a loopback address.
listen: "127.0.0.1:8080"

# Reverse proxies (CIDR networks) whose X-Forwarded-For entry is believed
# when the login page and client registration rate-limit per client
# address. Empty (the default): the TCP peer is the client and the header is
# ignored. When the peer is in this list, the right-most entry that is not
# itself a listed proxy is the client, so list only proxies that append the
# address they received from (Caddy does). Never list a network untrusted
# hosts can send from: they could choose the address they are limited as.
# Host bits must be zero; /0 is refused; at most 32 entries.
# Behind Caddy in Docker, list the subnet of the network the two containers
# share (docker network inspect <network> shows it), for example:
#   trusted_proxies: [172.18.0.0/16]
trusted_proxies: []

# Optional. A .md file inside the vault (vault-relative) whose content is
# sent to every assistant as the MCP server instructions on connect. It is
# re-read at most every 5 seconds, so edits reach new sessions without a
# restart. Tools can read it but never change, move, or delete it.
# instructions_file: AGENTS.md

# Extra vault-relative files or folders no tool may read or write.
# Entries must be non-empty, relative, free of ".." and control characters,
# and not the vault root. .git, .obsidian, and .cortex-mcp are always
# protected (at any depth), and .trash is receive-only; none of that is configurable.
# An entry also protects the same path below .trash/ (delete_note keeps the
# folder path there). Obsidian's own trash flattens paths, which no entry can
# match: with deny entries, consider adding .trash to deny as well.
deny: []

# Bearer tokens (cortex-mcp token create) for clients that cannot run a
# browser login. false = OAuth only: refused unless oauth.enabled is true and
# the owner has run cortex-mcp setup.
bearer_tokens: true

# The built-in OAuth 2.1 server that assistant apps (claude.ai, ChatGPT,
# Meta Muse, Claude Code) use to connect. Nothing can log in until the owner
# runs cortex-mcp setup on the host. false removes every OAuth endpoint.
oauth:
  enabled: true
  # Redirect URIs a client may register (dynamic registration or a client
  # metadata document). Entries: "loopback" (http://localhost, 127.0.0.1 or
  # [::1], any port, for native clients), an exact https URL, or an https
  # URL ending in "/*", which matches exactly one more path segment. A list
  # here replaces these defaults; at most 32 entries.
  redirect_allowlist:
    - https://claude.ai/api/mcp/auth_callback
    - https://chatgpt.com/connector_platform_oauth_redirect
    - https://chatgpt.com/connector/oauth/*
    - https://agent.meta.ai/api/hatch/oauth/callback
    - loopback

limits:
  max_write_bytes: 1048576    # per write, 1 to 8388608 (8 MiB, the largest note the vault reads)
  requests_per_minute: 60     # per client, 1 to 6000

logs:                         # rotation of state_dir/writes.log
  max_size_mb: 5              # 1 to 1024
  keep: 3                     # rotated files kept, 1 to 100
